[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-inspect-benchmarks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "google-genai>=1.69.0",
    "inspect-ai>=0.3.263",
    "inspect-evals==0.17.0",
    "openai>=3.13.0",
]

[project.entry-points.inspect_ai]
local_llm_inspect_benchmarks = "bench_inspect._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_inspect"]

[tool.bench]
custom-task-roots = ["benchmarks"]
log-dir = "logs"
task-config-dir = "bench-configs"
